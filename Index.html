<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Счастливая ферма</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8f5d8;--card:#fff;--text:#2b3a1f;--soil:#a9744a;--soil2:#8b5e3c;--acc:#3f9d3a;--muted:#6b7a5c;--bar:#d6e6c4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2615;--card:#2a361f;--text:#eaf3df;--soil:#6e4b30;--soil2:#583a24;--acc:#58b852;--muted:#9fb08d;--bar:#3a4a2c}}
:root[data-theme="dark"]{--bg:#1c2615;--card:#2a361f;--text:#eaf3df;--soil:#6e4b30;--soil2:#583a24;--acc:#58b852;--muted:#9fb08d;--bar:#3a4a2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:440px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:16px;padding:12px 16px;font-weight:600}
.xp{height:6px;background:var(--bar);border-radius:3px;margin:8px 0 14px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--acc);width:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plot{aspect-ratio:1;background:var(--soil);border:3px solid var(--soil2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;cursor:pointer;position:relative;user-select:none;-webkit-tap-highlight-color:transparent}
.plot:active{transform:scale(.96)}
.plot.ripe{animation:pulse 1s infinite;border-color:#f5c542}
@keyframes pulse{50%{transform:scale(1.04)}}
.plot small{font-size:12px;color:#fff;position:absolute;bottom:6px}
.plot .pb{position:absolute;left:8px;right:8px;bottom:22px;height:4px;background:rgba(0,0,0,.3);border-radius:2px;overflow:hidden}
.plot .pb i{display:block;height:100%;background:#9be06a}
.plot.locked{background:var(--bar);border-color:var(--bar);color:var(--muted)}
.plot.far{opacity:.4}
.seed.lock{opacity:.45}
.drop{position:absolute;top:4px;right:6px;font-size:14px}
h2{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plot.locked small{color:var(--muted)}
.seed{background:var(--card);border:2px solid transparent;border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;font-size:13px;color:var(--text);font-family:inherit}
.seed b{display:block;font-size:28px;font-weight:400}
.seed.sel{border-color:var(--acc)}
.seed span{color:var(--muted);font-size:11px;display:block;margin-top:2px}
.tools{display:flex;gap:8px;margin-top:12px}
.tool{flex:1;padding:12px;border-radius:12px;border:2px solid transparent;background:var(--card);color:var(--text);font-size:15px;font-family:inherit;cursor:pointer}
.tool.sel{border-color:var(--acc)}
#msg{min-height:20px;text-align:center;font-size:13px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<main>
<div class="top"><span>💰 <span id="coins">0</span></span><span>⭐ Уровень <span id="lvl">1</span></span></div>
<div class="xp"><i id="xpb"></i></div>
<div class="grid" id="grid"></div>
<div class="tools">
<button class="tool sel" id="tPlant">🌱 Сажать</button>
<button class="tool" id="tWater">💧 Полив</button>
</div>
<h2>Семена</h2>
<div class="shop" id="shop"></div>
<div id="msg">Выбери семена и нажми на грядку</div>
</main>
<script>
var CROPS={
carrot:{n:"Морковь",e:"🥕",cost:5,sell:12,sec:15,xp:3,lv:1},
wheat:{n:"Пшеница",e:"🌾",cost:10,sell:26,sec:45,xp:6,lv:1},
berry:{n:"Клубника",e:"🍓",cost:25,sell:75,sec:120,xp:15,lv:2},
tomato:{n:"Помидор",e:"🍅",cost:40,sell:140,sec:300,xp:25,lv:3},
corn:{n:"Кукуруза",e:"🌽",cost:80,sell:330,sec:900,xp:60,lv:4},
pumpkin:{n:"Тыква",e:"🎃",cost:200,sell:1000,sec:3600,xp:200,lv:5}
};
var MAX=15,KEY="happy-farm-v2";
var S={coins:50,xp:0,seed:"carrot",tool:"plant",n:6,plots:[]};
try{var raw=localStorage.getItem(KEY)||localStorage.getItem("happy-farm-v1");if(raw){var p=JSON.parse(raw);if(p&&p.plots){if(!p.n)p.n=9;S=p}}}catch(e){}
while(S.plots.length<MAX)S.plots.push(null);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function say(t){document.getElementById("msg").textContent=t}
function lvl(){var l=1;while(S.xp>=15*(l+1)*l)l++;return l}
function plotCost(){return Math.round(40*Math.pow(1.7,S.n-6))}
function fmt(s){return s<60?s+" с":s<3600?Math.ceil(s/60)+" мин":(Math.ceil(s/360)/10)+" ч"}
var grid=document.getElementById("grid");
for(var i=0;i<MAX;i++){(function(i){var d=document.createElement("div");d.className="plot";d.onclick=function(){tap(i)};grid.appendChild(d)})(i)}
var shop=document.getElementById("shop"),ORDER=Object.keys(CROPS);
ORDER.forEach(function(k){var c=CROPS[k];var b=document.createElement("button");b.className="seed";b.id="s_"+k;
b.innerHTML="<b>"+c.e+"</b>"+c.n+"<span>"+c.cost+" → "+c.sell+" · "+fmt(c.sec)+"</span><span class='lv'></span>";
b.onclick=function(){if(lvl()<c.lv){say(c.n+" откроется на уровне "+c.lv);return}S.seed=k;S.tool="plant";save();render()};shop.appendChild(b)});
document.getElementById("tPlant").onclick=function(){S.tool="plant";render()};
document.getElementById("tWater").onclick=function(){S.tool="water";render()};
function tap(i){
var now=Date.now();
if(i>=S.n){
if(i>S.n){say("Сначала открой предыдущую грядку");return}
var pc=plotCost();
if(S.coins<pc){say("Новая грядка стоит "+pc+" 💰");return}
S.coins-=pc;S.n++;say("Новая грядка открыта!");save();render();return}
var p=S.plots[i];
if(p&&now>=p.end){var c=CROPS[p.c],l0=lvl();S.coins+=c.sell;S.xp+=c.xp;S.plots[i]=null;
say("Урожай: +"+c.sell+" 💰, +"+c.xp+" опыта"+(lvl()>l0?" · новый уровень!":""));save();render();return}
if(!p){
if(S.tool==="water"){say("Здесь пока нечего поливать");return}
var cr=CROPS[S.seed];
if(S.coins<cr.cost){say("Не хватает монет на семена");return}
S.coins-=cr.cost;S.plots[i]={c:S.seed,start:now,end:now+cr.sec*1000,w:false};say("Посажено: "+cr.n);save();render();return}
if(S.tool==="water"){
if(p.w)say("Эту грядку уже поливали");
else{p.w=true;p.end=now+(p.end-now)*0.7;say("Полито: осталось на 30% меньше");save();render()}
return}
say("Ещё растёт, осталось "+fmt(Math.ceil((p.end-now)/1000)))}
function render(){
var now=Date.now(),els=grid.children;
if(S.coins<5&&!S.plots.slice(0,S.n).some(Boolean)){S.coins=5;save()}
for(var i=0;i<MAX;i++){var p=S.plots[i],el=els[i],h="",cl="plot";
if(i>=S.n){cl+=i===S.n?" locked":" locked far";h="🔒"+(i===S.n?"<small>"+plotCost()+" 💰</small>":"")}
else if(p){var c=CROPS[p.c],left=p.end-now;
if(left<=0){cl+=" ripe";h=c.e+"<small>Собрать!</small>"}
else{var pr=Math.max(0,Math.min(1,(now-p.start)/(p.end-p.start)));
h=(pr<0.5?"🌱":"🌿")+'<div class="pb"><i style="width:'+Math.round(pr*100)+'%"></i></div><small>'+fmt(Math.ceil(left/1000))+"</small>";
if(p.w)h+='<span class="drop">💧</span>'}}
else h='<span style="opacity:.35;font-size:24px">＋</span>';
if(el.className!==cl)el.className=cl;
if(el.innerHTML!==h)el.innerHTML=h}
var l=lvl(),base=15*l*(l-1),next=15*(l+1)*l;
document.getElementById("coins").textContent=S.coins;
document.getElementById("lvl").textContent=l;
document.getElementById("xpb").style.width=((S.xp-base)/(next-base)*100)+"%";
ORDER.forEach(function(k){var c=CROPS[k],b=document.getElementById("s_"+k),lk=l<c.lv;
b.className="seed"+(lk?" lock":"")+(!lk&&S.tool==="plant"&&S.seed===k?" sel":"");
b.lastChild.textContent=lk?"🔒 ур. "+c.lv:""});
document.getElementById("tPlant").className="tool"+(S.tool==="plant"?" sel":"");
document.getElementById("tWater").className="tool"+(S.tool==="water"?" sel":"")}
render();setInterval(render,1000);
</script>
</body>
</html>

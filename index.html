<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Весёлая ферма</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#ffd23f;--glass:rgba(255,255,255,.24)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;touch-action:manipulation}
body{background:linear-gradient(#4db8ff 0%,#a8e8ff 34%,#8be15a 34%,#3fa535 100%)}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em}
.sky{position:absolute;inset:0 0 auto 0;height:34%;overflow:hidden;pointer-events:none}
.scene{position:absolute;left:0;bottom:0;width:100%;height:100%}
.sun{position:absolute;right:6%;top:10%;width:70px;height:70px;animation:spin 40s linear infinite}
.cloud{position:absolute;width:90px;animation:drift linear infinite;opacity:.95}
.bf{position:absolute;left:8%;top:60%;width:26px;animation:fly 16s ease-in-out infinite}
.bf svg{width:100%;animation:flap .25s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(560px)}}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(160px,-30px) rotate(10deg)}50%{transform:translate(300px,24px) rotate(-6deg)}75%{transform:translate(140px,50px) rotate(8deg)}}
@keyframes flap{to{transform:scaleX(.45)}}
header{position:relative;z-index:2;display:flex;gap:8px;align-items:center;padding:12px 12px 4px}
.pill{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.5);border-radius:20px;padding:6px 12px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.2)}
#coins{font-size:20px;display:flex;gap:6px;align-items:center}
#coins .ic{width:26px;height:26px}
#coins.pop{animation:pop .35s}
.lv{flex:1}
.lv small{display:block;font-size:12px}
.bar{height:9px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe96b,#ff9f1c);transition:width .4s;border-radius:9px}
.title{position:relative;z-index:2;text-align:center;font-size:26px;font-weight:900;margin:2px 0 0;text-shadow:0 3px 0 #2d7a1f,0 0 20px rgba(255,255,255,.6)}
#field{position:relative;z-index:2;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:800px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(92%,400px);padding:14px;border-radius:26px;background:linear-gradient(#a8742f,#7a4a1d);box-shadow:0 14px 0 #5a3412,0 24px 30px rgba(0,0,0,.35);transform:rotateX(16deg)}
.plot{position:relative;aspect-ratio:1;border-radius:18px;background:radial-gradient(circle at 50% 35%,#8b5a2b,#5e3a17);box-shadow:inset 0 6px 10px rgba(0,0,0,.45),inset 0 -3px 0 rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.plot:active{transform:scale(.93)}
.pl{transform-origin:50% 100%;animation:sway 2.8s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.plot.ripe .pl{animation:bounce .9s ease-in-out infinite}
.plot.ripe::after{content:"";position:absolute;top:-8px;right:-4px;width:22px;height:22px;background:radial-gradient(circle,#fff 0 20%,transparent 22%),conic-gradient(from 0deg,transparent 0 40deg,#fff3a0 45deg,transparent 50deg 130deg,#fff3a0 135deg,transparent 140deg 220deg,#fff3a0 225deg,transparent 230deg 310deg,#fff3a0 315deg,transparent 320deg);border-radius:50%;animation:twinkle 1s infinite}
.plot.ripe{box-shadow:inset 0 6px 10px rgba(0,0,0,.45),0 0 18px 4px rgba(255,226,80,.85)}
.plot.empty .pl{opacity:.4;animation:none;width:30px;height:30px}
.plot.locked{background:radial-gradient(circle,#6c6c78,#3f3f4a)}
.plot.locked .lk{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:14px;gap:2px}
.plot.locked .lk .ic{width:30px;height:30px}
.plot.next{animation:glow 1.6s infinite}
.prog{position:absolute;left:12%;right:12%;bottom:6px;height:6px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9cff57,#2ee66d)}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.1)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(40deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 14px 4px rgba(255,255,255,.7)}}
@keyframes pop{50%{transform:scale(1.3)}}
nav{position:relative;z-index:2;display:flex;gap:8px;overflow-x:auto;padding:10px 12px 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.seed{flex:0 0 auto;min-width:84px;padding:8px 6px;border-radius:18px;text-align:center;background:var(--glass);border:3px solid transparent;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;font-weight:800;font-size:13px;text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .15s}
.seed .big{width:42px;height:42px;display:block;margin:0 auto 2px}
.seed small{display:block;font-size:11px;opacity:.95}
.seed.sel{border-color:var(--gold);background:rgba(255,210,63,.38);transform:translateY(-4px) scale(1.05);box-shadow:0 8px 14px rgba(0,0,0,.25)}
.seed.off{filter:grayscale(1);opacity:.6}
.fl{position:fixed;z-index:9;pointer-events:none;font-weight:900;font-size:20px;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.4);animation:up 1.1s ease-out forwards}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.pt{position:fixed;z-index:9;pointer-events:none;font-size:24px;animation:burst .9s ease-out forwards}
@keyframes burst{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4) rotate(240deg)}}
#toast{position:fixed;z-index:10;left:50%;top:18%;transform:translateX(-50%) scale(.6);opacity:0;padding:10px 20px;border-radius:22px;background:rgba(40,30,90,.9);font-weight:800;pointer-events:none;transition:.3s;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) scale(1)}
</style></head>
<body>

<g id="corn"><ellipse cx="32" cy="28" rx="11" ry="23" fill="#ffd93b" stroke="#c99a0a" stroke-width="2.5"/><path d="M26 12v32M32 6v44M38 12v32M23 20h18M22 28h20M23 36h18M25 44h14" stroke="#e0a812" stroke-width="1.6" fill="none"/><path d="M32 62Q8 54 14 20Q24 40 32 62z" fill="#5fcf45" stroke="#2b8a2b" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 62Q56 54 50 20Q40 40 32 62z" fill="#74dc55" stroke="#2b8a2b" stroke-width="2.5" stroke-linejoin="round"/></g>
<g id="pumpkin"><path d="M30 20Q28 8 38 6L40 11Q35 13 35 20z" fill="#4e9a2a" stroke="#2b5e14" stroke-width="2" stroke-linejoin="round"/><ellipse cx="32" cy="38" rx="28" ry="21" fill="#ff8f1f" stroke="#b9560a" stroke-width="2.5"/><ellipse cx="20" cy="38" rx="11" ry="20" fill="#ffa83a" stroke="#b9560a" stroke-width="2"/><ellipse cx="44" cy="38" rx="11" ry="20" fill="#ffa83a" stroke="#b9560a" stroke-width="2"/><ellipse cx="32" cy="38" rx="8" ry="21" fill="#ff8f1f" stroke="#b9560a" stroke-width="2"/><ellipse cx="14" cy="28" rx="3" ry="5" fill="#fff" opacity=".35"/></g>
<g id="sun_f"><path d="M32 40Q30 52 32 62" stroke="#3fae34" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M32 54Q46 52 50 42Q36 42 32 54z" fill="#6fd34a" stroke="#2b8a2b" stroke-width="2"/><g transform="translate(32 26)" fill="#ffd31a" stroke="#d99a00" stroke-width="1.5"><ellipse cy="-15" rx="5.5" ry="9"/><ellipse cy="-15" rx="5.5" ry="9" transform="rotate(45)"/><ellipse cy="-15" rx="5.5" ry="9" transform="rotate(90)"/><ellipse cy="-15" rx="5.5" ry="9" transform="rotate(135)"/><ellipse cy="-15" rx="5.5" ry="9" transform="rotate(180)"/><ellipse cy="-15" rx="5.5" ry="9" transform="rotate(225)"/><ellipse cy="-15" rx="5.5" ry="9" transform="rotate(270)"/><ellipse cy="-15" rx="5.5" ry="9" transform="rotate(315)"/></g><circle cx="32" cy="26" r="9.5" fill="#6b3b14" stroke="#4a2509" stroke-width="2"/><g fill="#a0662a"><circle cx="29" cy="23" r="1.4"/><circle cx="35" cy="23" r="1.4"/><circle cx="32" cy="27" r="1.4"/><circle cx="28" cy="29" r="1.4"/><circle cx="36" cy="29" r="1.4"/></g></g>
</defs></svg>

<div id="app">
<div class="sky">
<svg class="scene" viewBox="0 0 400 180" preserveAspectRatio="xMidYMax slice">
<path d="M0 120Q80 70 170 110T400 95V180H0z" fill="#79d653"/>
<g transform="translate(40 70)"><rect x="-2" y="40" width="8" height="26" fill="#7a4a1d"/><circle cx="2" cy="30" r="22" fill="#3fae34"/><circle cx="-12" cy="40" r="14" fill="#4cc83a"/><circle cx="16" cy="38" r="14" fill="#4cc83a"/><circle cx="-2" cy="22" r="6" fill="#ff5a5a"/><circle cx="14" cy="34" r="5" fill="#ff5a5a"/></g>

<g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"><path d="M110 112h130M120 104v18M150 102v20M180 104v18M210 104v18M240 106v16"/></g>

</svg>

<header>

<script>
var C=[
{n:'Морковь',g:'carrot',c:5,t:8,s:12,x:2,l:1},
{n:'Пшеница',g:'wheat',c:10,t:15,s:26,x:3,l:1},
{n:'Клубника',g:'berry',c:25,t:30,s:65,x:6,l:2},
{n:'Кукуруза',g:'corn',c:50,t:45,s:130,x:10,l:3},
{n:'Тыква',g:'pumpkin',c:100,t:70,s:270,x:18,l:4},
{n:'Подсолнух',g:'sun_f',c:200,t:100,s:580,x:32,l:5}];
var S={coins:30,xp:0,sel:0,open:6,plots:[]};
for(var i=0;i<12;i++)S.plots.push(null);
try{var j=JSON.parse(localStorage.getItem('farm3'));if(j&&j.plots)S=j}catch(e){}
function save(){try{localStorage.setItem('farm3',JSON.stringify(S))}catch(e){}}
function lvl(){return Math.floor(Math.sqrt(S.xp/10))+1}
var tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#4db8ff')}catch(e){}}
function hap(t){try{tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}}
function ic(id,c,st){return '<svg class="ic '+(c||'')+'" viewBox="0 0 64 64" style="'+(st||'')+'"><use href="#'+id+'"/></svg>'}
var W='clamp(36px,12vw,58px)';
var grid=document.getElementById('grid'),els=[];
for(let i=0;i<12;i++){var d=document.createElement('div');d.className='plot';d.onclick=function(){tap(i,d)};grid.appendChild(d);els.push(d)}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.className='on';clearTimeout(toast.h);toast.h=setTimeout(function(){el.className=''},1600)}
function fl(h,x,y,col){var f=document.createElement('div');f.className='fl';f.innerHTML=h;f.style.left=x+'px';f.style.top=y+'px';f.style.color=col||'#fff';document.body.appendChild(f);setTimeout(function(){f.remove()},1100)}
function burst(id,x,y,n){for(var k=0;k<n;k++){var p=document.createElement('div');p.className='pt';p.innerHTML=ic(id);p.style.left=x+'px';p.style.top=y+'px';var a=Math.random()*6.28,r=40+Math.random()*60;p.style.setProperty('--dx',Math.cos(a)*r+'px');p.style.setProperty('--dy',Math.sin(a)*r-30+'px');document.body.appendChild(p);(function(q){setTimeout(function(){q.remove()},900)})(p)}}
function pos(el){var r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/3]}
function left(p){return Math.max(0,p.at+C[p.c].t*1000-p.w-Date.now())}
function tap(i,el){
 var xy=pos(el),p=S.plots[i];
 if(i>=S.open){
  if(i!==S.open)return toast('Сначала открой предыдущую грядку');
  var cost=60*(S.open-5);
  if(S.coins<cost)return toast('Нужно '+cost+' монет');
  S.coins-=cost;S.open++;burst('star',xy[0],xy[1],10);toast('Новая грядка!');hap('medium');
 }else if(!p){
  var c=C[S.sel];
  if(lvl()<c.l)return toast('Откроется на уровне '+c.l);
  if(S.coins<c.c)return toast('Не хватает монет');
  S.coins-=c.c;S.plots[i]={c:S.sel,at:Date.now(),w:0,lw:0};
  burst('sprout',xy[0],xy[1],4);fl('−'+c.c+' '+ic('coin'),xy[0],xy[1],'#ffd0d0');hap();
 }else if(left(p)===0){
  var c2=C[p.c],ol=lvl();
  S.coins+=c2.s;S.xp+=c2.x;S.plots[i]=null;
  burst(c2.g,xy[0],xy[1],5);burst('coin',xy[0],xy[1],9);
  fl('+'+c2.s+' '+ic('coin'),xy[0],xy[1]-10,'#ffe45c');fl('+'+c2.x+' '+ic('star'),xy[0]+34,xy[1]+14,'#e3d2ff');hap('medium');
  if(lvl()>ol){toast('Новый уровень: '+lvl()+'!');burst('star',innerWidth/2,innerHeight/3,16);try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}}
  var cn=document.getElementById('coins');cn.classList.remove('pop');void cn.offsetWidth;cn.classList.add('pop');
 }else{
  var n=Date.now();
  if(n-p.lw>1200){p.w+=2500;p.lw=n;burst('drop',xy[0],xy[1]-10,4);fl('−2,5 с',xy[0],xy[1],'#9fe3ff');hap()}
 }
 save();draw(true);
}
function draw(force){
 document.getElementById('c').textContent=S.coins;
 var l=lvl(),a=10*(l-1)*(l-1),b=10*l*l;
 document.getElementById('lvt').innerHTML='Уровень '+l+' · '+ic('star')+' '+S.xp+'/'+b;
 document.getElementById('xb').style.width=Math.min(100,(S.xp-a)/(b-a)*100)+'%';
 for(var i=0;i<12;i++){
  var el=els[i],p=S.plots[i],k,h='',pr=0,cls='plot';
  if(i>=S.open){var nx=i===S.open;k=nx?'Ln':'Lx';cls+=' locked'+(nx?' next':'');h='<div class="lk">'+ic('lock')+(nx?'<span>'+60*(S.open-5)+' '+ic('coin')+'</span>':'')+'</div>'}
  else if(!p){k='E';cls+=' empty';h=ic('plus','pl')}
  else{
   var c=C[p.c],lf=left(p),pg=1-lf/(c.t*1000);pr=pg;
   var st=lf===0?'R':pg<.33?'a':pg<.7?'b':'c';k=st+p.c;
   var g=lf===0?c.g:st==='a'?'sprout':st==='b'?'bush':c.g;
   var sc=lf===0?1.05:st==='a'?.8:st==='b'?.95:.62;
   h=ic(g,'pl','width:calc('+W+'*'+sc+');height:calc('+W+'*'+sc+');'+(st==='c'?'filter:saturate(.55) drop-shadow(0 4px 3px rgba(0,0,0,.35))':''))+(lf===0?'':'<div class="prog"><i></i></div>');
   if(lf===0)cls+=' ripe';
  }
  if(el.dataset.k!==k){el.dataset.k=k;el.innerHTML=h;el.className=cls}
  var pi=el.querySelector('.prog i');if(pi)pi.style.width=Math.min(100,pr*100)+'%';
 }
 var sb=document.getElementById('seeds'),key=l+'|'+S.sel;
 if(force===true||sb.dataset.l!==key){
  sb.dataset.l=key;sb.innerHTML='';
  C.forEach(function(c,i){
   var d=document.createElement('div');d.className='seed'+(S.sel===i?' sel':'')+(l<c.l?' off':'');
   d.innerHTML=ic(c.g,'big')+(l<c.l?ic('lock')+' ур. '+c.l:c.c+' '+ic('coin')+' · '+c.t+' с')+'<small>→ '+c.s+' '+ic('coin')+'</small>';
   d.onclick=function(){if(l<c.l)return toast('Откроется на уровне '+c.l);S.sel=i;save();draw(true)};
   sb.appendChild(d);
  });
 }
}
draw(true);
setInterval(draw,250);
</script></body></html>
